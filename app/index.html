<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Golden Shine — Professional Cleaning Service</title>
    <meta
      name="description"
      content="Golden Shine Cleaning Service: residential, post-construction, deep, recurring, move-in/out and Airbnb cleaning in Boston, MA. Request your cleaning online in under a minute."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golden Shine Cleaning" />
    <meta property="og:url" content="https://goldenshinecleaning.com" />
    <meta property="og:title" content="Golden Shine — Professional Cleaning Service" />
    <meta
      property="og:description"
      content="Residential, post-construction, deep, recurring, move-in/out and Airbnb cleaning in Boston, MA. Request your cleaning online in under a minute."
    />
    <meta property="og:image" content="https://goldenshinecleaning.com/hero-bg.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Golden Shine professional home cleaning service in Boston" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Golden Shine — Professional Cleaning Service" />
    <meta name="twitter:description" content="Residential, post-construction, deep, recurring, move-in/out and Airbnb cleaning in Boston, MA. Request your cleaning online in under a minute." />
    <meta name="twitter:image" content="https://goldenshinecleaning.com/hero-bg.jpg" />
    <meta name="twitter:image:alt" content="Golden Shine professional home cleaning service in Boston" />

    <!-- PWA / App / Standard Meta -->
    <meta name="theme-color" content="#4F46E5" />
    <link rel="canonical" href="https://goldenshinecleaning.com" />
    <meta name="apple-mobile-web-app-title" content="Golden Shine" />


    <!-- Structured Data (JSON-LD) for LocalBusiness SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Golden Shine Cleaning Service",
        "description": "Professional residential, Airbnb, deep cleaning, and post-construction cleaning services in Boston, MA.",
        "image": "https://goldenshinecleaning.com/hero-bg.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Boston",
          "addressRegion": "MA",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "42.3601",
          "longitude": "-71.0589"
        },
        "url": "https://goldenshinecleaning.com",
        "telephone": "",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "08:00",
            "closes": "19:00"
          }
        ],
        "priceRange": "$$"
      }
    </script>

    <!--
      Sincroniza el idioma persistido antes del primer render para evitar un
      "flash" de idioma incorrecto. El valor lo gestiona src/i18n (localStorage
      `gs_locale`). Sin reemplazo DOM automático de textos.
    -->
    <script>
      (function () {
        try {
          var l = localStorage.getItem("gs_locale");
          if (l === "es" || l === "en") {
            document.documentElement.lang = l;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
